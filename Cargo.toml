[workspace]
members = ["crates/meetings-domain", "crates/sidenote-sync"]
exclude = ["crates/sidenote-sync/vendor/spake2"]
default-members = [".", "crates/meetings-domain", "crates/sidenote-sync"]
resolver = "3"

[package]
name = "sidenote"
default-run = "sidenote"
version = "0.1.0-dev.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[[example]]
name = "gpu_inventory"
required-features = ["desktop"]

[[example]]
name = "meeting-icon-spike"
required-features = ["desktop"]

[[example]]
name = "areas_proof"
required-features = ["desktop"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
base64 = "0.22"
jsonschema = { version = "0.37", default-features = false }
anyhow = "1"
automerge = "=0.12.0"
sidenote-sync = { path = "crates/sidenote-sync" }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.11"
tempfile = "3"
url = "2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
kaldi-fbank = { version = "=0.1.0", optional = true }
hound = "3.5"
blake3 = "1"
hex = "0.4"
zeroize = "1"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "signal"] }
wgpu = { optional = true, version = "~30.0.1", default-features = false, features = ["std", "dx12", "vulkan"] }
rune = { optional = true, git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a", default-features = false, features = ["accessibility"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a", optional = true, features = ["markdown"] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a", optional = true }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_StationsAndDesktops", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_Networking_WinHttp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
velopack = "=0.0.1298"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["transport-streamable-http-server"] }

[features]
dev = []
asr-runtime = ["dep:ort", "dep:kaldi-fbank"]
# Isolated recorder qualification with mocked scheduled-task cmdlets.
recorder-ready-proof = []
# Qualification build with a higher relay capability floor; no app version change.
relay-capability-v2 = []
# Explicit opt-in for synthetic headless qualification in optimized builds.
relay-qualification = []
# Explicit opt-in for the isolated headless idle-CPU qualification entry.
idle-cpu-proof = ["desktop"]
default = ["desktop", "ui-kit"]
desktop = ["dep:rune", "dep:wgpu", "dep:rune-kit", "dep:rune-motion", "dep:rune-theme-opencode"]
server = []
ui-kit = ["desktop"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
pollster = "1"
tempfile = "3"
# The font tests read glyph ids from Rune's layout; Rune already pulls in this version.
parley = { version = "0.12", default-features = false, features = ["std"] }

[patch.crates-io]
spake2 = { path = "crates/sidenote-sync/vendor/spake2" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
# Rune's workspace patches these crates to its vendor/ copies, and a dependency's [patch] does not
# apply to the app that builds it, so the app repeats them at the same revision.
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
winit = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "3d037b49e459cd45d9438a46d50be3b20d53542a" }
