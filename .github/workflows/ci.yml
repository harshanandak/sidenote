name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
      relay: ${{ steps.paths.outputs.relay }}
      tools: ${{ steps.paths.outputs.tools }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: |
          python3 -I .github/ci_changes.py --self-test
          python3 -I .github/ci_changes.py

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Linux process and filesystem boundaries
        run: python3 -I tools/prove_linux_boundaries.py . --self-test
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        id: rust
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-unknown-linux-gnu
            target/debug
          key: ci-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: ci-ubuntu-24.04-${{ steps.rust.outputs.cachekey }}-
      - name: Clippy on Stable and Dev ASR test targets
        run: |
          cargo clippy --workspace --locked --all-targets --features asr-runtime -- -D warnings
          cargo clippy --workspace --locked --all-targets --features dev,asr-runtime -- -D warnings
      - name: Test Stable and Dev
        shell: bash
        run: |
          umask 077
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root"/{state,meetings,peers,cache,data,xdg-state,public-test-key,bin}
          # Ask layout fixtures need executable discovery without a real helper or login.
          printf '#!/bin/sh\nexit 125\n' > "$root/bin/codex"
          chmod 0700 "$root/bin/codex"
          export PATH="$root/bin:$PATH"
          export TMPDIR="$root" SIDENOTE_DATA_DIR="$root/state" SIDENOTE_HEX_DIR="$root/meetings"
          export SIDENOTE_PEERS_DIR="$root/peers" XDG_DATA_HOME="$root/data" XDG_CACHE_HOME="$root/cache"
          export XDG_STATE_HOME="$root/xdg-state" CREDENTIALS_DIRECTORY="$root/public-test-key"
          unset DISPLAY WAYLAND_DISPLAY XDG_CONFIG_HOME
          python3 -I -c 'import os; from pathlib import Path; (Path(os.environ["CREDENTIALS_DIRECTORY"]) / "sidenote-key").write_bytes(bytes(range(32)))'
          # The translation fixture reserves a bare --skip token for its child protocol.
          skip=(--skip=tree_worker::tests::packaged_service_admits_ordinary_helpers
                --skip=packaged_speech_service_admits_only_speech
                --skip=service::speech::proofs::service_shutdown_replans_and_replays_over_http
                --skip=service::speech::proofs::speech_service_fixture
                --skip=service::speech::proofs::faults::http_stream_disconnect_releases_slots_and_revocation_ends_replay
                --skip=service::speech::proofs::faults::nested_publication_interruptions_recover_without_losing_receipts
                --skip=service::speech::proofs::faults::one_unavailable_status_log_does_not_stop_other_sessions
                --skip=service::speech::proofs::faults::rejected_speech_survives_production_planning_and_http_completion
                --skip=service::speech::proofs::faults::retained_status_is_bounded_and_cannot_kill_the_listener
                --skip=service::speech::proofs::locking::job_creation_keeps_intake_ownership_until_processing_is_locked
                --skip=tests::server_role_exposes_only_scoped_host_probe)
          cargo test --locked --workspace --no-fail-fast --features asr-runtime -- "${skip[@]}"
          cargo test --locked --workspace --no-fail-fast --features dev,asr-runtime -- "${skip[@]}"
          cargo test --locked -p sidenote --no-default-features --test channel_boundary
          cargo test --locked -p sidenote --no-default-features --features asr-runtime --test channel_boundary
          cargo test --locked -p sidenote --lib --bin sidenote -- \
            core::agent_tools:: core::ask_options:: core::meeting_watch:: \
            ui::ask_switch_tests::a_fallback_answer_through_the_real_ask_names_the_helper_that_answered_and_survives_reload

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - working-directory: relay
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test tests

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.linux == 'false'
        run: python3 -I tools/prove_linux_boundaries.py . --self-test
      - run: python3 -I .github/ci_changes.py --self-test
      - name: Run portable pipeline tests
        run: >-
          python3 -I tools/pipeline-tests.py
          -k test_routing. -k test_job_contract.
          -k test_fixed_patterns -k test_timeout_and_missing
      - shell: pwsh
        run: ./tools/dependency_notices_proof.ps1

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        id: rust
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - name: Add GNU tools to PATH
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-gnu
            target/debug
          key: ci-windows-gnu-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: ci-windows-gnu-${{ steps.rust.outputs.cachekey }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install Wrangler for headless Windows integration tests
        working-directory: relay
        run: bun install --frozen-lockfile
      - name: Run Windows pipeline tests
        if: needs.changes.outputs.tools == 'true'
        run: python -I tools/pipeline-tests.py
      - name: Compile Dev test targets without ASR
        run: cargo check --workspace --locked --tests --features dev
      - name: Clippy on Stable and Dev ASR targets
        shell: bash
        run: |
          cargo clippy --workspace --locked --all-targets --features asr-runtime -- -D warnings
          cargo clippy --workspace --locked --all-targets --features dev,asr-runtime -- -D warnings
      - name: Build the sync worker and fault-test fixture
        run: cargo build --locked -p sidenote-sync --bin sidenote-sync-worker --example worker_fault
      - name: Test Windows routing CLI recording admission
        run: cargo test --locked -p sidenote --features dev,asr-runtime --test public_cpu_audio
      - name: Test Windows worker exits and Tasks edits under CPU load
        shell: bash
        run: |
          export SIDENOTE_DATA_DIR=$(cygpath -w "$RUNNER_TEMP/sidenote-stress")
          python -I - <<'PY'
          import os
          import subprocess
          import sys

          cargo = ["cargo", "test", "--locked", "-p", "sidenote", "--features", "dev,asr-runtime"]
          subprocess.run([*cargo, "--no-run", "--lib", "--bin", "sidenote"], check=True)
          groups = [
              (["--lib"], "core::meeting_router::batches::worker::tests::", [
                  "closed_input_before_process_exit_preserves_status",
                  "process_exit_after_response_poll_preserves_status",
                  "process_crash_preserves_completed_receipts",
              ]),
              (["--bin", "sidenote"], "ui::tasks::tests::", [
                  "a_stale_completion_reloads_the_saved_tick_before_clearing_pending_state",
                  "closing_a_removed_tasks_panel_keeps_its_title_draft",
                  "legacy_duplicate_keeps_its_index_for_feedback_and_title_save",
                  "panel_mark_done_failure_survives_selecting_another_task",
              ]),
          ]
          burners = []
          results = []
          try:
              for _ in range(os.cpu_count() or 1):
                  burner = subprocess.Popen(
                      [sys.executable, "-I", "-u", "-c", "print('ready')\nwhile True: pass"],
                      stdout=subprocess.PIPE,
                  )
                  burners.append(burner)
                  if burner.stdout.readline().strip() != b"ready":
                      raise RuntimeError("CPU load process did not start")
              for target, prefix, tests in groups:
                  results.append(subprocess.run(
                      [*cargo, *target, "--", "--exact", *(prefix + test for test in tests)],
                      check=False,
                  ).returncode)
          finally:
              for burner in burners:
                  burner.terminate()
              for burner in burners:
                  burner.wait()
          sys.exit(int(any(results)))
          PY
      - name: Test Windows-specific behavior
        shell: bash
        run: |
          export SIDENOTE_DATA_DIR=$(cygpath -w "$RUNNER_TEMP/sidenote-ci")
          # Child-process fixtures reserve a bare --skip token for their protocol.
          cargo test --locked --features dev,asr-runtime -p sidenote --lib -- \
            platform::windows::tests:: updates::implementation:: hex_install:: meeting_icon:: \
            platform::windows::close_tests:: core::annotations::notebook_tests:: \
            platform::windows::window_icon::tests:: \
            approval_seals_reviewed_bytes_and_send_pins_the_same_files core::config::tests:: \
            core::daily_check::background_tests:: core::meeting_evidence::speech_host_tests:: \
            preparation_file_io_fails_without_retry_and_preserves_content_free_os_diagnostic \
            core::mcp_connect::isolated_tests:: legacy_adapter_contends_with_the_core_claim_and_reclaims_after_release \
            core::meeting_router::batches::worker:: core::meeting_router::hex_bridge::tests::fake_process_timeout \
            core::meeting_router::hex_http::status_tests:: \
            core::meeting_router::jobs::handoff::tests:: core::meeting_router::jobs::r1_tests:: \
            core::meeting_router::production::fixture_tools:: core::meeting_router::production::pipeline:: \
            core::meeting_router::production::gap_tests:: core::meeting_router::production::http_tests:: \
            core::meeting_router::production::no_speech_tests:: core::meeting_router::production::probe_tests:: \
            core::meeting_router::production::round2_tests:: core::meeting_router::revision::captured_tests:: \
            core::meeting_router::revision::receipts:: provisioning_review_load_uses_the_resolved_path \
            automatic_runtime_comes_from_the_package_and_explicit_path_wins \
            dev40_setup_required_keeps_the_capture_and_shows_the_count \
            core::notes::tests::corruption:: core::notes::tests::review:: core::notes::tests::routing:: \
            core::notes::tests::translation::busy:: core::notes::tests::translation::failed:: \
            core::notes::tests::translation::producer:: core::relay_preview:: core::speech_host:: \
            listener::pipeline_tests:: listener::notes_environment::tests:: \
            service::tests::exclusively_locked_device_file_falls_back_once \
            core::summary_edits::tests:: \
            core::notes::tests::edited_summary:: \
            core::note_edit_tool::tests:: \
            core::note_edit_tool::transport::tests:: \
            --skip=meeting_icon_capture_affinity_updates_live_windows
          # This test exists only in a build without the ASR feature.
          cargo test --locked --features dev -p sidenote --lib -- \
            core::meeting_evidence::speech_host_tests::speech_host_without_runtime_does_not_consume_a_local_attempt
          cargo test --locked --features dev,asr-runtime -p sidenote --bin sidenote -- \
            install_hooks_tests:: ui::models::dev40_ ui::models::provisioning_review_ \
            ui::window::close_tests:: \
            ui::nav::tests::blocked_new_meeting_keeps_status_below_native_titlebar \
            ui::nav::tests::narrow_new_meeting_ \
            ui::recording_state_tests::recording_pill_is_only_needed_on_the_other_meeting \
            ui::hex::connection::stop_tests:: ui::hex::connection::tests:: ui::hex::settings:: \
            ui::live::recording_control::tests:: \
            ui::list::tests::meeting_row_uses_the_singular_for_one_task \
            ui::updates::listener_tests::install_action_waits_for_a_verified_download \
            ui::tasks::tests::empty_tasks_page_offers_to_add_a_task \
            ui::ask_switch_tests::deletion_cancels_delayed_ask_text_and_answers_in_all_scopes \
            ui::ask_switch_tests::suppression_failure_during_ui_apply_retries_unchanged_catalog \
            ui::ask_switch_tests::meeting_ticks_keep_the_all_meetings_chat
          SIDENOTE_SYNC_TEST_ARTIFACT_DIR="$(cygpath -aw "target/$CARGO_BUILD_TARGET/debug")" \
            cargo test --locked -p sidenote-sync --lib -- worker::tests::
          cargo test --locked --features dev,asr-runtime -p sidenote --test idle_cpu --test relay_preview --test meeting_delete_storage --test meeting_delete_visibility
          cargo test --locked -p sidenote --no-default-features --test channel_boundary
          cargo test --locked -p sidenote --lib --bin sidenote -- \
            core::agent_tools:: core::ask_options:: listener::pipeline_tests:: \
            ui::ask_switch_tests::a_fallback_answer_through_the_real_ask_names_the_helper_that_answered_and_survives_reload

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: List contributor checks
        run: python3 -I tools/check.py --list
      - name: Run fast contributor checks
        run: python3 -I tools/check.py --fast

  gate:
    name: CI Gate
    if: always()
    needs: [changes, linux, relay, tools, windows, docs]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify required job results
        env:
          CHANGES: ${{ needs.changes.result }}
          LINUX: ${{ needs.linux.result }}/${{ needs.changes.outputs.linux }}
          WINDOWS: ${{ needs.windows.result }}/${{ needs.changes.outputs.windows }}
          RELAY: ${{ needs.relay.result }}/${{ needs.changes.outputs.relay }}
          TOOLS: ${{ needs.tools.result }}/${{ needs.changes.outputs.tools }}
          DOCS: ${{ needs.docs.result }}
        shell: bash
        run: |
          [[ "$CHANGES" == success ]] || { echo "changes: expected success, got $CHANGES"; exit 1; }
          failed=0
          for job in LINUX WINDOWS RELAY TOOLS; do
            case "${!job}" in
              success/true|skipped/false) ;;
              *) echo "$job: unexpected result/required flag ${!job}"; failed=1 ;;
            esac
          done
          [[ "$DOCS" == success ]] || { echo "docs: expected success, got $DOCS"; failed=1; }
          exit "$failed"
