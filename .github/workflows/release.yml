name: Windows release artifacts

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release_ci.ps1
      - tools/release_update_proof.ps1
      - tools/pack_release.ps1
  workflow_dispatch:
    inputs:
      tag:
        description: Expected build tag (v followed by the Cargo package version)
        type: string
        required: true
      channel:
        description: Channel to build as an Actions artifact
        type: choice
        options: [stable, dev]
        required: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.task == 'package' && 'Package Windows release artifacts' || 'Prove clean Windows install and update' }}
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(github.event_name == 'pull_request' && '["package","update-proof"]' || '["package"]') }}
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release identity
        id: identity
        shell: pwsh
        run: ./tools/release_ci.ps1 -ValidateOnly
      - name: Test release contract and validate this build
        if: matrix.task == 'package'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/release_ci.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Release contract self-test failed.' }
          ./tools/release_ci.ps1 -ValidateOnly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.427'
      - name: Install pinned Velopack CLI
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gnuBin = Join-Path $env:MSYS2_ROOT 'mingw64/bin'
          $toolPath = Join-Path $env:RUNNER_TEMP 'velopack-tools'
          dotnet tool install vpk --version 0.0.1298 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'Velopack CLI installation failed.' }
          @($toolPath, $gnuBin) | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
          "RUST_GNU_BIN=$gnuBin" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Build and validate Windows packages
        id: package
        if: matrix.task == 'package'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sidenote-target
          RELEASE_ASSETS: ${{ runner.temp }}/sidenote-release
        run: |
          # Spectre injects ANSI into vpk help on Actions, including when the packer captures it.
          $env:GITHUB_ACTIONS = $null
          ./tools/release_ci.ps1 -OutputDirectory $env:RELEASE_ASSETS
      # Preparation builds distribute unsigned packages through Actions only.
      - name: Upload validated packages
        if: matrix.task == 'package' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidenote-windows-${{ github.event_name }}-${{ steps.package.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidenote-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Prove installed updates against an isolated feed
        if: matrix.task == 'update-proof'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sidenote-target
        run: |
          pwsh -NoProfile -File tools/release_update_proof.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Update proof self-test failed.' }
          ./tools/release_update_proof.ps1

  publish:
    name: Publish Windows release artifacts
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      ARTIFACT_NAME: sidenote-windows-${{ github.event_name }}-${{ needs.package.outputs.tag }}-${{ github.run_attempt }}
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/sidenote-release
      - name: Verify release checksums
        working-directory: ${{ runner.temp }}/sidenote-release
        run: sha256sum -c SHA256SUMS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish or dry-run GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ runner.temp }}/sidenote-release
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          dev='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.(0|[1-9][0-9]*)$'
          if [[ $tag =~ $stable ]]; then
            channel=stable
          elif [[ $tag =~ $dev ]]; then
            channel=dev
          else
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi

          notes_source="docs/releases/$tag.md"
          notes_file="$RUNNER_TEMP/sidenote-$tag-notes.md"
          if [[ -f $notes_source ]]; then
            cat "$notes_source" > "$notes_file"
          elif [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "Missing required release notes: $notes_source" >&2
            exit 1
          else
            echo "$notes_source is missing; using placeholder notes for this dry run."
            printf 'Placeholder release notes for %s.\n' "$tag" > "$notes_file"
          fi
          cat >>"$notes_file" <<'EOF'

          ## Verify your download

          Download `SHA256SUMS` from the same release, then run `Get-FileHash <file> -Algorithm SHA256` in PowerShell and compare the result with the matching line in `SHA256SUMS`.
          EOF
          echo "Built release notes for $tag at $notes_file"

          shopt -s nullglob
          assets=("$ASSET_DIR"/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release files were downloaded to $ASSET_DIR." >&2
            exit 1
          fi

          print_command() {
            printf 'Would run:'
            printf ' %q' "$@"
            printf '\n'
          }

          create=(gh release create "$tag" --repo "$repo" --verify-tag --title "$tag" --notes-file "$notes_file" --draft)
          upload=(gh release upload "$tag" --repo "$repo" "${assets[@]}")
          publish_release=(gh release edit "$tag" --repo "$repo" --draft=false)
          if [[ $channel == stable ]]; then
            create+=(--latest=true)
            publish_release+=(--latest=true)
          else
            create+=(--prerelease --latest=false)
            publish_release+=(--prerelease --latest=false)
          fi

          dry_run=1
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            dry_run=0
          fi
          if (( dry_run )); then
            echo 'Dry run: no GitHub release write commands will be run.'
            print_command "${create[@]}"
            print_command "${upload[@]}"
            print_command "${publish_release[@]}"
          else
            "${create[@]}"
            "${upload[@]}"
            "${publish_release[@]}"
          fi

          if [[ $channel == dev ]]; then
            rolling_create=(gh release create dev --repo "$repo" --target "$GITHUB_SHA" --title 'Sidenote dev' --notes-file "$notes_file" --prerelease --latest=false "${assets[@]}")
            rolling_upload=(gh release upload dev --repo "$repo" --clobber "${assets[@]}")
            rolling_exists=0
            if gh release view dev --repo "$repo" --json tagName >/dev/null 2>&1; then
              rolling_exists=1
            fi
            if (( dry_run )); then
              if (( rolling_exists )); then
                echo 'Rolling dev release exists; the write would upload replacement assets.'
                print_command "${rolling_upload[@]}"
              else
                echo 'Rolling dev release is missing; the write would create it.'
                print_command "${rolling_create[@]}"
              fi
            elif (( rolling_exists )); then
              "${rolling_upload[@]}"
            else
              "${rolling_create[@]}"
            fi
          fi
