name: Windows release artifacts

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release_ci.ps1
      - tools/release_publish.sh
      - tools/release_update_proof.ps1
      - tools/install_release.ps1
      - tools/pack_release.ps1
      - Cargo.toml
      - docs/releases/**
  workflow_dispatch:
    inputs:
      tag:
        description: Versioned tag to build or prove (for example v0.1.0-dev.1)
        type: string
        required: true
      channel:
        description: Channel for a build dry run
        type: choice
        options: [stable, dev]
        default: stable
      prove_published:
        description: Prove the published tag instead of building a release artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.task == 'package' && 'Package Windows release artifacts' || 'Prove clean Windows install and update' }}
    if: (github.event_name != 'push' || !github.event.deleted) && !inputs.prove_published
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(github.event_name == 'pull_request' && '["package","update-proof"]' || '["package"]') }}
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release identity
        id: identity
        shell: pwsh
        run: ./tools/release_ci.ps1 -ValidateOnly
      - name: Test release contract and validate this build
        if: matrix.task == 'package'
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/release_ci.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Release contract self-test failed.' }
          ./tools/release_ci.ps1 -ValidateOnly
      - &rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - &msys2
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
          path-type: inherit
      - &dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.427'
      - &velopack
        name: Install pinned Velopack CLI
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gnuBin = Join-Path $env:MSYS2_ROOT 'mingw64/bin'
          $toolPath = Join-Path $env:RUNNER_TEMP 'velopack-tools'
          dotnet tool install vpk --version 0.0.1298 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'Velopack CLI installation failed.' }
          @($toolPath, $gnuBin) | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
          "RUST_GNU_BIN=$gnuBin" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Build and validate Windows packages
        id: package
        if: matrix.task == 'package'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sidenote-target
          RELEASE_ASSETS: ${{ runner.temp }}/sidenote-release
        run: |
          # Spectre injects ANSI into vpk help on Actions, including when the packer captures it.
          $env:GITHUB_ACTIONS = $null
          ./tools/release_ci.ps1 -OutputDirectory $env:RELEASE_ASSETS
      # One name per run: "Re-run failed jobs" keeps this artifact for the publish jobs,
      # and a full re-run replaces it.
      - name: Upload validated packages
        id: upload
        if: matrix.task == 'package' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidenote-windows-${{ github.event_name }}-${{ steps.package.outputs.tag }}
          path: ${{ runner.temp }}/sidenote-release
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Prove installed updates against an isolated feed
        if: matrix.task == 'update-proof'
        id: source-proof
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sidenote-target
        run: |
          pwsh -NoProfile -File tools/release_update_proof.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Update proof self-test failed.' }
          ./tools/release_update_proof.ps1 -DiagnosticsDirectory (Join-Path $env:RUNNER_TEMP 'sidenote-source-proof-diagnostics')
      - name: Upload source proof diagnostics
        if: failure() && steps.source-proof.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidenote-source-proof-diagnostics
          path: ${{ runner.temp }}/sidenote-source-proof-diagnostics
          overwrite: true
          retention-days: 7

  exact-package-proof:
    name: Prove clean install and update on the exact release packages
    needs: package
    if: >-
      ${{ !cancelled() &&
      (inputs.prove_published || (github.event_name != 'workflow_dispatch' && needs.package.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.prove.outputs.artifact-id }}
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
      RELEASE_TAG: ${{ inputs.prove_published && inputs.tag || needs.package.outputs.tag }}
      ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
    steps:
      - *checkout
      - name: Require the uploaded artifact ID
        if: '!inputs.prove_published && !needs.package.outputs.artifact-id'
        shell: pwsh
        run: throw 'Packaging did not return an artifact ID.'
      - name: Download the uploaded packages
        if: '!inputs.prove_published'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sidenote-release
      - name: Download the published release
        if: inputs.prove_published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '\Av\d+\.\d+\.\d+(?:-dev\.\d+)?\z') { throw 'Expected a versioned release tag.' }
          $draft = gh release view --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft -- $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0 -or $draft -cne 'false') { throw 'Expected a published release.' }
          gh release download --repo $env:GITHUB_REPOSITORY --dir (Join-Path $env:RUNNER_TEMP 'sidenote-release') --pattern '*' -- $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release asset download failed.' }
      - *rust
      - *msys2
      - *dotnet
      - *velopack
      - name: Prove install and update
        id: prove
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sidenote-target
        run: |
          pwsh -NoProfile -File tools/release_update_proof.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Update proof self-test failed.' }
          ./tools/release_update_proof.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'sidenote-release') -ExpectedTag $env:RELEASE_TAG `
            -DiagnosticsDirectory (Join-Path $env:RUNNER_TEMP 'sidenote-exact-proof-diagnostics')
          "artifact-id=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload exact package proof diagnostics
        if: failure() && steps.prove.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidenote-exact-proof-diagnostics
          path: ${{ runner.temp }}/sidenote-exact-proof-diagnostics
          overwrite: true
          retention-days: 7

  publish-dry-run:
    name: Dry-run Windows release publish
    if: github.event_name != 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      ARTIFACT_NAME: sidenote-windows-${{ github.event_name }}-${{ needs.package.outputs.tag }}
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/sidenote-release
      - name: Verify release checksums
        working-directory: ${{ runner.temp }}/sidenote-release
        run: sha256sum -c SHA256SUMS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dry-run GitHub release publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: '1'
          ASSET_DIR: ${{ runner.temp }}/sidenote-release
        run: bash tools/release_publish.sh

  publish:
    name: Publish Windows release artifacts
    if: >-
      github.event_name == 'push' &&
      needs.exact-package-proof.result == 'success' &&
      needs.exact-package-proof.outputs.artifact-id != '' &&
      needs.exact-package-proof.outputs.artifact-id == needs.package.outputs.artifact-id
    needs: [package, exact-package-proof]
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sidenote-release
      - name: Verify release checksums
        working-directory: ${{ runner.temp }}/sidenote-release
        run: sha256sum -c SHA256SUMS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: '0'
          ASSET_DIR: ${{ runner.temp }}/sidenote-release
        run: bash tools/release_publish.sh
